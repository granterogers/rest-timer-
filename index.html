<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rest Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rest Timer">
<meta name="theme-color" content="#1565c0">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="display" id="display">
    <div class="time" id="timeLabel">02:00</div>
  </header>

  <main class="button-zone">
    <button class="rest-button" id="restButton" aria-label="Start rest timer">
      <span id="buttonLabel">START</span>
    </button>
  </main>

  <footer class="controls">
    <div class="controls-title">Rest Duration</div>
    <div class="wheel-wrap">
      <div class="wheel-highlight"></div>
      <div class="wheel" id="wheel"></div>
    </div>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
