<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rest Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rest Timer">
<meta name="theme-color" content="#0d47a1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="display" id="display">
    <div class="time" id="timeLabel">02:00</div>
  </header>

  <main class="button-zone">
    <button class="rest-button" id="restButton" aria-label="Begin rest">
      <img class="rest-button-img" src="assets/button-green.png" alt="" draggable="false">
      <span class="rest-button-label" id="buttonLabel">
        <span class="label-line">BEGIN</span>
        <span class="label-line">REST</span>
      </span>
    </button>
  </main>

  <footer class="controls">
    <div class="stepper-row">
      <span class="stepper-label">Rest Duration</span>
      <button class="step-btn" id="decBtn" aria-label="Decrease rest duration">&minus;</button>
      <button class="step-btn" id="incBtn" aria-label="Increase rest duration">+</button>
    </div>
    <div class="volume-row">
      <svg class="volume-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="M4 9v6h4l5 5V4L8 9H4zm11.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="100" aria-label="Sound volume">
    </div>
  </footer>

  <audio id="keepAliveAudio" src="assets/silence.wav" loop playsinline preload="auto" aria-hidden="true"></audio>

</div>

<script src="app.js"></script>
</body>
</html>
